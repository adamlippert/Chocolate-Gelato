name: "🧪 Publish Dev Prerelease"

# Mirrors publish.yml, but for prereleases only, writing a separate manifest.
#
# GitHub emits `prereleased` (not `released`) when a release is published with the
# prerelease flag, so this workflow and publish.yml are mutually exclusive — a given
# release triggers exactly one of them.
#
# The resulting manifest lives alongside the stable one on gh-pages:
#   stable → .../gh-pages/repository.json
#   dev    → .../gh-pages/repository-dev.json
#
# Add the dev URL as a second plugin repository in Jellyfin to install prereleases.
# Both manifests carry the same plugin GUID, so Jellyfin resolves to whichever version
# is highest — keep dev versions BELOW the next stable version, or only configure the
# dev repository while actively testing.

on:
  release:
    types:
      - prereleased

permissions:
  contents: write

jobs:
  build:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/build.yaml@master
    with:
      dotnet-version: "9.0.*"
      dotnet-target: "net9.0"
  upload:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v5
        with:
          name: build-artifact
      - name: Prepare GitHub Release assets
        run: |-
          for file in ./*; do
            md5sum ${file#./} >> ${file%.*}.md5
            sha256sum ${file#./} >> ${file%.*}.sha256
          done
          ls -l
      - name: Upload GitHub Release assets
        uses: shogo82148/actions-upload-release-asset@v1.9.0
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./*
  generate:
    runs-on: ubuntu-latest
    needs:
      - upload
    steps:
      - name: Jellyfin plugin repo (dev channel)
        uses: Kevinjil/jellyfin-plugin-repo-action@v0.4.3
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          # Same gh-pages branch, separate file — no extra branch to create or clean up,
          # and the two workflows never write the same path.
          pagesFile: repository-dev.json
